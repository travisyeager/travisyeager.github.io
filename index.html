<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Travis Yeager</title>
  <meta name="description" content="Travis Yeager. Pull up a couch, the TV's on.">
  <link rel="canonical" href="https://travisyeager.com/">
  <meta property="og:title" content="Travis Yeager">
  <meta property="og:description" content="Pull up a couch, the TV's on.">
  <meta property="og:url" content="https://travisyeager.com/">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#3b2414">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='10' width='56' height='44' rx='8' fill='%23222'/%3E%3Crect x='10' y='16' width='36' height='32' rx='6' fill='%235fb3a7'/%3E%3Ccircle cx='53' cy='24' r='3' fill='%23999'/%3E%3Ccircle cx='53' cy='34' r='3' fill='%23999'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=VT323&display=swap" rel="stylesheet">
  <style>
    /*
      Layout: one "stage" holds the room, sized like object-fit: contain.
      Every object is placed in stage units (--u). Landscape stage = 160 x 100 units,
      portrait stage = 100 x 170 units. Wall, floor and couch arms run past the stage
      edges so any leftover viewport space is still room, never empty page.
    */
    :root {
      --wood-1: #6a4327;
      --wood-2: #573520;
      --oak: #b07a45;
      --oak-dark: #7c5230;
      --plastic: #1e1e21;
      --carpet: #9b8a70;
      --phosphor: #9fe3cf;
      --vt: "VT323", ui-monospace, Menlo, monospace;
      --u: min(1dvh, 100vw / 160);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      overflow: hidden;
      background: #3b2414;
      color: #f2e8d8;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 3px solid #ffd36a; outline-offset: 4px; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    .room { position: fixed; inset: 0; overflow: hidden; } /* clips the oversized wall/floor so mobile layout viewport can't grow */
    .stage {
      position: absolute;
      left: 50%; bottom: 0;
      width: calc(160 * var(--u));
      height: calc(100 * var(--u));
      transform: translateX(-50%);
    }
    .o {
      position: absolute;
      left: calc(var(--x) * var(--u));
      top: calc(var(--y) * var(--u));
      width: calc(var(--w) * var(--u));
      height: calc(var(--h) * var(--u));
      container-type: size;
    }

    /* ---------- Room shell ---------- */
    .wall {
      position: absolute;
      left: -100vw; right: -100vw; top: -100vh;
      bottom: calc(100% - 68 * var(--u));
      background:
        radial-gradient(ellipse calc(40 * var(--u)) calc(50 * var(--u)) at calc(100vw + 11 * var(--u)) calc(100vh + 24 * var(--u)), rgba(255, 196, 110, 0.32), transparent 70%),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.45) 0 2px, rgba(255, 220, 170, 0.06) 2px 4px, transparent 4px calc(10 * var(--u))),
        repeating-linear-gradient(90deg, transparent 0 7px, rgba(0, 0, 0, 0.05) 7px 9px, transparent 9px 17px, rgba(255, 255, 255, 0.025) 17px 19px),
        linear-gradient(180deg, var(--wood-2), var(--wood-1) 55%, var(--wood-2));
    }
    .wall::after { /* popcorn ceiling */
      content: ""; position: absolute; left: 0; right: 0; top: 0;
      height: calc(100vh + 2 * var(--u));
      background:
        radial-gradient(circle at 40% 40%, rgba(0, 0, 0, 0.07) 0 1px, transparent 1.6px) 0 0 / 5px 5px,
        radial-gradient(circle at 60% 70%, rgba(255, 255, 255, 0.5) 0 1px, transparent 1.6px) 0 0 / 7px 6px,
        linear-gradient(180deg, #cfc6b4, #e3dccb);
    }
    .wall::before { /* crown molding */
      content: ""; position: absolute; left: 0; right: 0;
      top: calc(100vh + 2 * var(--u)); height: calc(2.2 * var(--u));
      background: linear-gradient(#2a180c, #4a2d18 40%, #2a180c);
      box-shadow: 0 calc(0.6 * var(--u)) calc(1.2 * var(--u)) rgba(0, 0, 0, 0.45);
    }
    .floor {
      position: absolute;
      left: -100vw; right: -100vw; bottom: -100vh;
      top: calc(68 * var(--u));
      background:
        radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.06) 0 1px, transparent 1.5px) 0 0 / 5px 5px,
        radial-gradient(circle at 70% 60%, rgba(0, 0, 0, 0.10) 0 1px, transparent 1.5px) 0 0 / 4px 4px,
        linear-gradient(180deg, #6e604c, var(--carpet) 30%, #a8977c);
      border-top: calc(1.6 * var(--u)) solid #3a2312; /* baseboard */
    }

    /* ---------- Wall dressing ---------- */
    .window { --x: 21; --y: 11; --w: 24; --h: 38; }
    .window .pane {
      position: absolute; inset: 0;
      border: 1.4cqw solid #e9e1d0;
      box-shadow: 0 0 0 0.8cqw #cfc4ae, 0 1cqw 3cqw rgba(0, 0, 0, 0.45);
      background:
        repeating-linear-gradient(180deg, #efe9dc 0 3.2cqh, #b9b09d 3.2cqh 3.6cqh, rgba(0, 0, 0, 0.18) 3.6cqh 4cqh),
        #efe9dc;
    }
    .window .pane::before { /* daylight leaking between slats */
      content: ""; position: absolute; inset: 0;
      background: repeating-linear-gradient(180deg, transparent 0 3.2cqh, rgba(255, 240, 200, 0.9) 3.2cqh 3.5cqh, transparent 3.5cqh 4cqh);
      mix-blend-mode: screen; opacity: 0.6;
    }
    .window .pane::after { /* pull cord */
      content: ""; position: absolute; right: 8%; top: 0; width: 0.6cqw; height: 70%;
      background: #d9cfbb;
    }
    .window .sill {
      position: absolute; left: -6%; right: -6%; bottom: -5%; height: 5%;
      background: linear-gradient(#efe7d6, #c9bea7);
      box-shadow: 0 1cqw 2cqw rgba(0, 0, 0, 0.4);
    }

    .art { --x: 122; --y: 13; --w: 26; --h: 20; }
    .art .frame {
      position: absolute; inset: 0;
      border: 2.4cqw solid #c8a25a;
      outline: 0.6cqw solid #8d6c33;
      box-shadow: 0 1.5cqw 4cqw rgba(0, 0, 0, 0.5);
      background: #f1ead9;
      padding: 5cqw;
    }
    .art svg { width: 100%; height: 100%; display: block; }

    .lamp { --x: 5; --y: 18; --w: 12; --h: 54; }
    .lamp .shade {
      position: absolute; left: 0; right: 0; top: 0; height: 26%;
      background: linear-gradient(90deg, #d9c39b, #fbedcc 45%, #cdb68c);
      clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%);
    }
    .lamp .shade::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8%;
      background: rgba(255, 220, 150, 0.9); filter: blur(2px);
    }
    .lamp .pole { position: absolute; left: 47%; width: 6%; top: 26%; bottom: 4%; background: linear-gradient(90deg, #8c6a2a, #e8cb7a, #8c6a2a); }
    .lamp .base { position: absolute; left: 22%; right: 22%; bottom: 0; height: 5%; border-radius: 50%; background: radial-gradient(#e8cb7a, #6b4f1c); }

    .plant { --x: 132; --y: 38; --w: 22; --h: 40; }
    .plant .pot {
      position: absolute; left: 24%; right: 24%; bottom: 0; height: 30%;
      background: linear-gradient(90deg, #8d3f22, #c4673d 45%, #7a341b);
      clip-path: polygon(0 0, 100% 0, 86% 100%, 14% 100%);
    }
    .plant .leaf {
      position: absolute; left: 50%; bottom: 26%;
      width: 18%; height: 46%;
      background: linear-gradient(90deg, #2f5a2b, #4f8a42 50%, #2a4f26);
      border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
      transform-origin: 50% 100%;
      transform: translateX(-50%) rotate(var(--r));
    }

    /* ---------- TV stand ---------- */
    .stand { --x: 46; --y: 58; --w: 68; --h: 22; }
    .stand .top {
      position: absolute; left: 0; right: 0; top: 0; height: 8%;
      background: linear-gradient(#c48d55, var(--oak));
    }
    .stand .body {
      position: absolute; left: 1.5%; right: 1.5%; top: 8%; bottom: 0;
      background:
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.05) 0 3px, transparent 3px 9px),
        linear-gradient(var(--oak), var(--oak-dark));
      box-shadow: 0 2cqw 4cqw rgba(0, 0, 0, 0.5);
      display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw; padding: 2.5cqw;
    }
    .stand .bay {
      background: #1a110a;
      box-shadow: inset 0 1cqw 2cqw rgba(0, 0, 0, 0.8);
      position: relative;
      display: flex; align-items: flex-end; justify-content: center; gap: 1cqw;
      padding: 0 2cqw 1.2cqw;
    }
    .vcr {
      width: 100%; height: 48%;
      background: linear-gradient(#3a3a3e, #232326);
      border-radius: 0.6cqw;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.4cqw;
    }
    .vcr .slot { width: 46%; height: 26%; background: #0c0c0d; border-radius: 0.4cqw; box-shadow: inset 0 0.3cqw 0 #000, 0 0.2cqw 0 #4a4a4f; }
    .vcr .clock {
      font: 3.6cqw/1 var(--vt);
      color: #5ef2a5;
      background: #0b1410;
      padding: 0.3cqw 1cqw;
      text-shadow: 0 0 1cqw rgba(94, 242, 165, 0.8);
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .tapes { width: 100%; height: 70%; display: flex; gap: 0.5cqw; align-items: flex-end; }
    .tapes i { flex: 1; height: 100%; background: #111; border-top: 1.4cqw solid #ddd; }
    .tapes i:nth-child(2) { border-top-color: #e2b23a; }
    .tapes i:nth-child(4) { border-top-color: #c7463a; }
    .tapes i:nth-child(6) { border-top-color: #3a7bc7; }

    /* ---------- The TV ---------- */
    .tv { --x: 52; --y: 13; --w: 56; --h: 46; z-index: 2; }
    .ears { position: absolute; left: 50%; bottom: 100%; width: 0; height: 0; }
    .ears i {
      position: absolute; bottom: 0; left: 0;
      width: 0.8cqw; height: 34cqw;
      background: linear-gradient(90deg, #888, #eee, #888);
      transform-origin: 50% 100%;
      border-radius: 1cqw;
    }
    .ears i:nth-child(1) { transform: rotate(-32deg); }
    .ears i:nth-child(2) { transform: rotate(24deg); }
    .ears b { position: absolute; left: -7cqw; bottom: -1cqw; width: 14cqw; height: 4cqw; border-radius: 50% 50% 0 0; background: #2a2a2d; }
    .cab {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent 12%),
        linear-gradient(160deg, #2c2c30, var(--plastic) 50%, #141416);
      border-radius: 5cqw 5cqw 3cqw 3cqw;
      box-shadow: inset 0 0 0 0.4cqw rgba(255, 255, 255, 0.04), 0 3cqw 6cqw rgba(0, 0, 0, 0.6);
    }
    .bezel {
      position: absolute; left: 4.5%; top: 6%; width: 75%; height: 81%;
      border-radius: 5cqw;
      background: linear-gradient(#0d0d0e, #1a1a1c);
      box-shadow: inset 0 0.8cqw 1.5cqw rgba(0, 0, 0, 0.9), 0 0.4cqw 0 rgba(255, 255, 255, 0.06);
      padding: 3cqw;
    }
    .screen {
      position: relative; width: 100%; height: 100%;
      overflow: hidden;
      border-radius: 14% / 18%;
      background: #050605;
      box-shadow: 0 0 0 0.5cqw #000;
      isolation: isolate;
    }
    .screen .yt { position: absolute; inset: 0; }
    .screen .yt iframe, .screen .yt > div {
      /* 16:9 player stretched over a 4:3 tube crops the pillarbox bars old uploads usually have */
      position: absolute; top: 0; left: 50%;
      height: 100%; width: 133.34%;
      transform: translateX(-50%);
      border: 0;
      pointer-events: none;
    }
    .snow { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; opacity: 0.9; transition: opacity 0.25s; }
    .screen.live .snow { opacity: 0; }
    .screen.flick .snow { opacity: 0.9; transition: none; }
    .glass {
      position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background:
        repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse 120% 100% at 30% 15%, rgba(255, 255, 255, 0.16), transparent 40%),
        radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.65) 100%);
    }
    .osd {
      position: absolute; z-index: 4; top: 6%; right: 8%;
      font: 7cqw/1 var(--vt); color: #7dff9a;
      text-shadow: 0 0 1cqw #3f3, 0.3cqw 0.3cqw 0 #000;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .osd.hide { opacity: 0; }
    .nosignal {
      position: absolute; z-index: 4; inset: 0; display: none;
      place-items: center; align-content: center; gap: 2cqw;
      font: 6cqw/1 var(--vt); color: #fff; text-shadow: 0.3cqw 0.3cqw 0 #000; letter-spacing: 0.1em;
      pointer-events: none;
    }
    .nosignal small { font-size: 3.6cqw; opacity: 0.8; letter-spacing: 0.05em; }
    .screen.nosig .nosignal { display: grid; }
    .sound {
      position: absolute; z-index: 5; left: 50%; bottom: 9%;
      transform: translateX(-50%);
      font: 5cqw/1 var(--vt); letter-spacing: 0.06em;
      color: #fff; background: rgba(0, 0, 160, 0.85);
      padding: 1.6cqw 3cqw 1.2cqw;
      border: 0.4cqw solid #fff;
      white-space: nowrap;
      animation: nudge 1.6s ease-in-out infinite;
    }
    .sound[hidden] { display: none; }
    @keyframes nudge { 50% { transform: translateX(-50%) scale(1.05); } }
    .screen.off .yt, .screen.off .snow, .screen.off .osd, .screen.off .sound, .screen.off .nosignal { visibility: hidden; }
    .screen::after { /* power-off collapse line */
      content: ""; position: absolute; left: 50%; top: 50%; z-index: 6;
      width: 100%; height: 100%; background: #e8fff8; opacity: 0;
      transform: translate(-50%, -50%) scale(1, 1); pointer-events: none;
    }
    .screen.off::after { animation: crtoff 0.45s ease-in forwards; }
    @keyframes crtoff {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1, 1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1, 0.006); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0, 0.006); }
    }
    .side {
      position: absolute; right: 3%; top: 8%; width: 14%; height: 79%;
      display: flex; flex-direction: column; align-items: center; gap: 4cqw;
    }
    .grille { width: 100%; flex: 1; background: repeating-linear-gradient(180deg, #0a0a0b 0 1cqw, #2a2a2e 1cqw 2cqw); border-radius: 1cqw; }
    .knob { width: 6cqw; height: 6cqw; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #777, #222 70%); box-shadow: 0 0.4cqw 0.6cqw rgba(0, 0, 0, 0.6); }
    .led { width: 1.4cqw; height: 1.4cqw; border-radius: 50%; background: #ff3b2f; box-shadow: 0 0 1.5cqw #ff3b2f; }
    .tv.off .led { background: #400; box-shadow: none; }
    .badge {
      position: absolute; left: 4.5%; bottom: 3.5%;
      font: 3.4cqw/1 "Archivo Black", sans-serif; letter-spacing: 0.25em; color: #9a9aa0;
    }

    /* ---------- Coffee table (foreground) ---------- */
    .table { --x: 20; --y: 75; --w: 120; --h: 28; z-index: 3; }
    .table .slab {
      position: absolute; inset: 0;
      clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%);
      background:
        repeating-linear-gradient(92deg, rgba(0, 0, 0, 0.06) 0 2px, transparent 2px 11px, rgba(255, 255, 255, 0.04) 11px 13px, transparent 13px 23px),
        linear-gradient(180deg, #a06c3c, #c38b52 40%, #b07a45);
    }
    .table .slab::before { /* top edge highlight */
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3%;
      background: linear-gradient(#e0ae74, transparent);
    }
    .item { position: absolute; display: block; transition: transform 0.2s ease; container-type: size; }
    .item:hover { transform: translateY(-1cqh) rotate(var(--r, 0deg)) scale(1.03) !important; }

    .mag {
      left: 17%; top: 8%; width: 21%; height: 80%;
      --r: -6deg; transform: rotate(var(--r));
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.25), transparent 40%),
        linear-gradient(180deg, #13a3a0, #0d6f86);
      box-shadow: 0.6cqw 1cqw 1.6cqw rgba(0, 0, 0, 0.45);
      padding: 0;
      color: #fff;
      overflow: hidden;
    }
    .mag .mast {
      display: block; margin: 7cqw 0 0 7cqw;
      font: 17cqw/0.88 "Archivo Black", sans-serif;
      letter-spacing: -0.02em;
      color: #ffe14d;
      text-shadow: 1.2cqw 1.2cqw 0 #c2185b;
    }
    .mag .issue { display: block; font: 700 4.6cqw/1 ui-sans-serif, sans-serif; letter-spacing: 0.12em; margin: 4cqw 0 0 7cqw; opacity: 0.85; }
    .mag .cover-line {
      position: absolute; left: 6%; right: 34%; bottom: 7%;
      font: 9cqw/1 "Archivo Black", sans-serif; text-transform: uppercase;
      text-shadow: 0.2cqw 0.2cqw 0 rgba(0, 0, 0, 0.4);
    }
    .mag .cover-line em { display: block; font-style: normal; font: 700 5.2cqw/1.2 ui-sans-serif, sans-serif; text-transform: none; color: #ffe14d; margin-top: 5%; text-shadow: none; }
    .mag .dot {
      position: absolute; right: 5%; bottom: 8%;
      width: 28cqw; height: 28cqw; border-radius: 50%;
      background: #c2185b; color: #fff;
      display: grid; place-items: center; text-align: center;
      font: 5.4cqw/1.05 "Archivo Black", sans-serif;
      transform: rotate(12deg);
    }

    .remote {
      left: 46%; top: 4%; width: 7%; height: 84%;
      --r: 14deg; transform: rotate(var(--r));
      background: linear-gradient(90deg, #232326, #3a3a3e 50%, #1d1d20);
      border-radius: 1.6cqw 1.6cqw 2.4cqw 2.4cqw;
      box-shadow: 0.6cqw 1.2cqw 1.6cqw rgba(0, 0, 0, 0.5);
      display: flex; flex-direction: column; align-items: center; gap: 4%;
      padding: 0;
    }
    .remote:hover { transform: rotate(var(--r)) !important; }
    .remote .ir { margin-top: 12cqh; width: 40%; height: 3%; background: #4a0a0a; border-radius: 1cqw; }
    .remote button {
      width: 52%; aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #8a8a90, #4a4a50);
      font: 20cqw/1 var(--vt); color: #fff;
      box-shadow: 0 0.3cqw 0 #111;
      display: grid; place-items: center;
      position: relative;
    }
    .remote button::before { content: ""; position: absolute; inset: -40%; } /* bigger tap target */
    .remote button:active { transform: translateY(0.2cqw); box-shadow: none; }
    .remote .pwr { background: radial-gradient(circle at 40% 35%, #ff6b5e, #b3241a); }
    .remote .mute { background: radial-gradient(circle at 40% 35%, #6ab0ff, #1f5fb3); }
    .remote .rows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6cqw; width: 70%; margin-top: 2%; }
    .remote .rows i { aspect-ratio: 1.4; background: #555; border-radius: 0.5cqw; }

    .vhs {
      left: 62%; top: 8%; width: 22%; height: 66%;
      --r: 5deg; transform: rotate(var(--r));
    }
    .vhs .sleeve {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #1b1b1d, #0d0d0e);
      border-radius: 0.6cqw;
      box-shadow: 0.6cqw 1.2cqw 1.6cqw rgba(0, 0, 0, 0.5);
    }
    .vhs .reels { /* tape reels */
      position: absolute; left: 22%; right: 22%; top: 12%; height: 26%;
      background: #2c2c30; border-radius: 0.5cqw;
      display: flex; justify-content: space-around; align-items: center;
    }
    .vhs .reels i { width: 22%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(#ddd 22%, #3a2a1c 24% 92%, #111 94%); }
    .vhs .label {
      position: absolute; left: 7%; right: 7%; bottom: 10%; height: 44%;
      background: #fbf7ea;
      border-top: 4cqw solid #e2b23a;
      color: #1a1a1a;
      padding: 3% 5%;
      display: flex; flex-direction: column; justify-content: center; gap: 4%;
    }
    .vhs .label b { font: 13cqw/1 "Comic Sans MS", "Marker Felt", "Chalkboard SE", cursive; color: #1a3d8f; }
    .vhs .label span { font: 6.4cqw/1.25 ui-sans-serif, sans-serif; color: #555; }
    .vhs .label span u { text-decoration: none; border-bottom: 0.2cqw solid #c7463a; }

    .ring { /* coffee-cup ring stain */
      position: absolute; left: 88%; top: 22%; width: 6%; aspect-ratio: 1.2; border-radius: 50%;
      border: 0.4cqw solid rgba(70, 35, 10, 0.25);
    }

    /* ---------- Couch arms (viewer's own couch, fixed to the viewport corners) ---------- */
    .arm {
      position: absolute; bottom: calc(-10 * var(--u)); z-index: 4;
      width: calc(22 * var(--u)); height: calc(40 * var(--u));
      background:
        repeating-linear-gradient(0deg, rgba(31, 95, 90, 0.55) 0 calc(0.9 * var(--u)), transparent calc(0.9 * var(--u)) calc(4 * var(--u))),
        repeating-linear-gradient(90deg, rgba(31, 95, 90, 0.55) 0 calc(0.9 * var(--u)), transparent calc(0.9 * var(--u)) calc(4 * var(--u))),
        repeating-linear-gradient(90deg, rgba(230, 200, 150, 0.18) 0 2px, transparent 2px calc(2 * var(--u))),
        linear-gradient(180deg, #8a4a5c, #6b3445);
      box-shadow: inset 0 calc(2 * var(--u)) calc(3 * var(--u)) rgba(255, 220, 200, 0.18), inset 0 calc(-6 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, 0.5);
      filter: blur(0.6px);
    }
    .arm.l { left: calc(-9 * var(--u)); border-radius: 0 calc(10 * var(--u)) 0 0; transform: rotate(8deg); }
    .arm.r { right: calc(-9 * var(--u)); border-radius: calc(10 * var(--u)) 0 0 0; transform: rotate(-8deg); }
    .shade-all { position: absolute; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(20, 10, 0, 0.45)); }

    /* ---------- Portrait: rearrange onto a 100 x 170 stage ---------- */
    @media (max-aspect-ratio: 5/6) {
      :root { --u: min(100vw / 100, 1dvh * 100 / 200); }
      .stage { width: calc(100 * var(--u)); height: calc(200 * var(--u)); }
      .wall { bottom: calc(100% - 136 * var(--u)); }
      .wall::before { top: calc(100vh + 1 * var(--u)); }
      .floor { top: calc(136 * var(--u)); }
      .window { --x: 6; --y: 16; --w: 30; --h: 26; }
      .art { --x: 62; --y: 18; --w: 30; --h: 22; }
      .lamp, .plant { display: none; }
      .tv { --x: 6; --y: 70; --w: 88; --h: 72.3; }
      .ears i { height: 18cqw; }
      .stand { --x: 4; --y: 139; --w: 92; --h: 22; }
      .table { --x: -4; --y: 156; --w: 108; --h: 48; }
      .mag { left: 6%; top: 5%; width: 38%; height: 80%; }
      .remote { left: 47%; top: 3%; width: 12%; height: 86%; --r: 6deg; }
      .remote .rows { display: none; }
      .vhs { left: 62%; top: 8%; width: 34%; height: 54%; --r: 4deg; }
      .ring { display: none; }
      .arm { width: calc(14 * var(--u)); height: calc(40 * var(--u)); bottom: calc(-26 * var(--u)); }
      .arm.l { left: calc(-10 * var(--u)); }
      .arm.r { right: calc(-10 * var(--u)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <noscript><p style="position:fixed;left:0;right:0;bottom:0;padding:12px;background:#000;text-align:center;font-family:monospace;z-index:9">me [at] travisyeager [dot] com</p></noscript>

  <script>
    /* =====================  CONFIG  =====================
       Paste your YouTube playlist ID here. It's the part after "list=" in the
       playlist URL, e.g. https://www.youtube.com/playlist?list=PLxxxxxxxx */
    var PLAYLIST_ID = "PASTE_PLAYLIST_ID_HERE";
    var SHUFFLE = true;
    /* ==================================================== */

    // Email is assembled at runtime so scrapers reading raw markup don't find it.
    (function () {
      var parts = ["moc", "regaeysivart", "em"];
      var rev = function (s) { return s.split("").reverse().join(""); };
      var addr = rev(parts[2]) + String.fromCharCode(64) + rev(parts[1]) + "." + rev(parts[0]);
      document.querySelectorAll(".js-mail").forEach(function (a) {
        a.setAttribute("href", "mai" + "lto:" + addr);
        a.setAttribute("title", addr);
      });
    })();

    (function () {
      var screen = document.getElementById("screen");
      var tv = document.getElementById("tv");
      var osd = document.getElementById("osd");
      var soundBtn = document.getElementById("sound");
      var canvas = document.getElementById("snow");
      var ctx = canvas.getContext("2d");
      var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var player = null, ready = false, on = true, muted = true, ch = 3, osdTimer;

      // Static: redraw random grey pixels ~24 times a second, only while visible.
      var img = ctx.createImageData(canvas.width, canvas.height), last = 0;
      function snow(t) {
        var visible = !screen.classList.contains("live") || screen.classList.contains("flick");
        if (visible && on && t - last > 40) {
          last = t;
          var d = img.data;
          for (var i = 0; i < d.length; i += 4) { var v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
          ctx.putImageData(img, 0, 0);
        }
        if (!still) requestAnimationFrame(snow);
      }
      requestAnimationFrame(snow);

      function showOsd(text, ms) {
        osd.textContent = text;
        osd.classList.remove("hide");
        clearTimeout(osdTimer);
        osdTimer = setTimeout(function () { osd.classList.add("hide"); }, ms || 2200);
      }
      function flick() {
        screen.classList.add("flick");
        setTimeout(function () { screen.classList.remove("flick"); }, 350);
      }

      var configured = PLAYLIST_ID && PLAYLIST_ID.indexOf("PASTE_") !== 0;
      if (!configured) {
        screen.classList.add("nosig");
        soundBtn.hidden = true;
      } else {
        window.onYouTubeIframeAPIReady = function () {
          player = new YT.Player("player", {
            host: "https://www.youtube-nocookie.com",
            playerVars: {
              listType: "playlist", list: PLAYLIST_ID,
              autoplay: 1, mute: 1, playsinline: 1, controls: 0, disablekb: 1,
              rel: 0, iv_load_policy: 3, fs: 0, loop: 1
            },
            events: {
              onReady: function () {
                ready = true;
                player.mute();
                if (SHUFFLE) player.setShuffle(true);
                player.setLoop(true);
                player.playVideo();
              },
              onStateChange: function (e) {
                if (e.data === YT.PlayerState.PLAYING) {
                  if (!screen.classList.contains("live")) showOsd("CH " + String(ch).padStart(2, "0"));
                  screen.classList.add("live");
                } else if (e.data === YT.PlayerState.BUFFERING || e.data === YT.PlayerState.UNSTARTED) {
                  screen.classList.remove("live");
                }
              },
              // Music videos often block embedding or are region-locked; skip to the next one.
              onError: function () { if (ready) player.nextVideo(); }
            }
          });
        };
        var s = document.createElement("script");
        s.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(s);
      }

      function setMuted(m) {
        muted = m;
        soundBtn.hidden = !m || !configured;
        if (!ready) return;
        if (m) { player.mute(); showOsd("MUTE"); }
        else { player.unMute(); player.setVolume(80); player.playVideo(); showOsd("VOL ███████░░"); }
      }
      function power() {
        on = !on;
        screen.classList.toggle("off", !on);
        tv.classList.toggle("off", !on);
        if (ready) on ? player.playVideo() : player.pauseVideo();
        if (on) { flick(); showOsd("CH " + String(ch).padStart(2, "0")); }
      }
      function channel(dir) {
        if (!on) return power();
        flick();
        ch = ((ch - 2 + dir + 98) % 98) + 2; // stays in 02..99 like a real dial
        showOsd("CH " + String(ch).padStart(2, "0"));
        if (ready) dir > 0 ? player.nextVideo() : player.previousVideo();
      }

      soundBtn.addEventListener("click", function () { setMuted(false); });
      document.getElementById("mute").addEventListener("click", function () { if (configured) setMuted(!muted); });
      document.getElementById("pwr").addEventListener("click", power);
      document.getElementById("chup").addEventListener("click", function () { channel(1); });
      document.getElementById("chdn").addEventListener("click", function () { channel(-1); });
      showOsd("CH 03", 3000);
    })();
  </script>
