<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travis Yeager</title>
  <meta name="description" content="Travis Yeager">
  <link rel="canonical" href="https://travisyeager.com/">
  <meta property="og:title" content="Travis Yeager">
  <meta property="og:url" content="https://travisyeager.com/">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='30' fill='%23fff' text-anchor='middle'%3ETY%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --rule: #e7e5e4;
      --accent: #1c1917;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --rule: #292524;
        --accent: #f5f5f4;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 520px; }
    h1 {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(2.5rem, 9vw, 3.75rem);
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    hr {
      border: 0;
      border-top: 1px solid var(--rule);
      margin: 28px 0 20px;
      width: 48px;
    }
    ul { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 28px; }
    a {
      color: var(--fg);
      text-decoration: none;
      font-size: 1.0625rem;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 2px;
      transition: border-color .15s ease;
    }
    a:hover, a:focus-visible { border-bottom-color: var(--accent); outline: none; }
    footer { margin-top: 48px; color: var(--muted); font-size: .8125rem; }
  </style>
</head>
<body>
  <main>
    <h1>Travis Yeager</h1>
    <hr>
    <ul>
      <li><a href="mailto:me@travisyeager.com">me@travisyeager.com</a></li>
      <li><a href="https://www.linkedin.com/in/traviswyeager/" rel="me noopener">LinkedIn</a></li>
    </ul>
    <footer>&copy; <span id="y">2026</span> Travis Yeager</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
